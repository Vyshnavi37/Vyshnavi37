<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" role="img" aria-label="Tech stack: React, Vue, NestJS, Node.js, TypeScript, PostgreSQL, Docker, Azure and more">

<style>
  .t  { font-family: Georgia, 'Times New Roman', serif; fill:#eef3fa; letter-spacing:4px; }
  .k  { font-family: Georgia, 'Times New Roman', serif; fill:#9fb3c8; letter-spacing:3px; }
  .b  { font-family: Georgia, 'Times New Roman', serif; fill:#cdd9e8; }
  .m  { font-family: Consolas, 'Courier New', monospace; fill:#dbe6f3; }
  .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(18px);} to { opacity:1; transform: translateY(0);} }
  .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.6s ease forwards .2s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .chip rect { fill:#16243c; stroke:#3b5272; }
  .chip:hover rect { stroke:#cfe0f5; }
  .glow { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { stroke-opacity:.35; } 50% { stroke-opacity:1; } }
  .shine { animation: shine 5s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-200px);} 60%,100% { transform: translateX(1100px);} }
  .flicker { animation: flicker 2.6s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { opacity:.55;} 50% { opacity:1;} }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a1222"/><stop offset="1" stop-color="#14223b"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9fb3c8" stop-opacity="0"/><stop offset=".5" stop-color="#e6edf6"/><stop offset="1" stop-color="#9fb3c8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#13213a"/><stop offset="1" stop-color="#0d1729"/>
  </linearGradient>
</defs>
